
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GEMINI_API_KEY" \
            -d '{
              "model": "gemini-3.8-flash",
              "messages": [
                {
                  "role": "user",
                  "content": "Responda apenas OK"
                }
              ]
            }'

      - name: AI Reviewer
        uses: anc95/ChatGPT-CodeReview@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_ENDPOINT: https://generativelanguage.googleapis.com/v1beta/openai/
          LANGUAGE: Portuguese
          MODEL: gemini-3.8-flash
          PROMPT: |
            Aja como um Engenheiro de Segurança Sênior (DevSecOps).
            Analise o DIFF deste Pull Request buscando:
            1. Vulnerabilidades OWASP Top 10.
            2. Code Smells e complexidade desnecessária.
            3. Boas práticas de Java 25 e Spring Boot 3.4.
            4. Comente diretamente nas linhas afetadas.
