name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Essencial para que a IA comente no seu PR
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini Code Review
        uses: sshnaidm/gemini-code-review-action@v2 # <--- Nome corrigido aqui
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }} # Parâmetro esperado por esta action
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: 'gemini-3.8-flash' # Usando o modelo estável mais recente do seu painel
          language: 'Portuguese'
          prompt: |
            Aja como um Engenheiro de Segurança Sênior (DevSecOps). 
            Analise o DIFF deste Pull Request buscando:
            1. Vulnerabilidades OWASP Top 10 (especialmente SQL Injection e Insecure Deserialization).
            2. Code Smells e complexidade ciclomática desnecessária.
            3. Aderência às melhores práticas de Java 25 e Spring Boot 3.4.
            4. Responda com comentários técnicos e construtivos diretamente nas linhas do código afetado.
